
name: NSE Market Connection Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'nse_test.py'
      - '.github/workflows/nse-test.yml'

permissions:
  contents: read

jobs:
  test-nse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP library
        run: |
          python -m pip install --upgrade pip
          pip install mcp

      - name: Test NSE connection
        run: python -u nse_test.py
