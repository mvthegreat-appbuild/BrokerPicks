name: Update NSE Stock Prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP library
        run: |
          python -m pip install --upgrade pip
          pip install mcp

      - name: Fetch NSE prices
        run: python -u nse_prices.py

      - name: Save prices to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NSE stock prices"
            git push
          else
            echo "No price changes to save"
          fi
