
name: Update Media Swing Trade Picks

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-media-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch media swing trade headlines
        run: python -u media_picks.py

      - name: Save media picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media_picks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update media swing trade picks"
            git push
          else
            echo "No media pick changes to save"
          fi
