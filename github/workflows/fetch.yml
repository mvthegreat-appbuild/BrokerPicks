name: Update picks
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 13 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json
          git commit -m "update picks" || exit 0
          git push
